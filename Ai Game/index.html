<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Butterfly</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #8dddea 0%, #7ec86b 100%);
      font-family: Arial, sans-serif;
      color: #fff;
    }
    #gameContainer {
      width: 480px;
      max-width: 100%;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    canvas {
      display: block;
      width: 100%;
      border: 6px solid #2e7d32;
      border-radius: 18px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
      background: linear-gradient(180deg, #88def4 0%, #8be17d 55%, #6fbf5a 100%);
    }
    #info {
      margin-top: 14px;
    }
    .score {
      font-size: 22px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    #startText {
      margin-top: 8px;
      font-size: 15px;
      line-height: 1.4;
      color: #f1f8e9;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    <div id="info">
      <div class="score">Score: <span id="score">0</span></div>
      <div id="startText">Press Arrow Up to flap. Use Left and Right to steer</div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const startText = document.getElementById('startText');
    const width = canvas.width;
    const height = canvas.height;

    const gravity = 0.5;
    const flapForce = -9;
    const lateralSpeed = 4;
    const obstacleWidth = 80;
    const gapHeight = 170;
    const obstacleSpacing = 170;

    let score = 0;
    let bestScore = 0;
    let frame = 0;
    let gameActive = false;

    const butterfly = {
      x: 100,
      y: height / 2,
      vx: 0,
      vy: 0,
      radius: 18,
      angle: 0,
    };

    const obstacles = [];
    const keys = {
      ArrowUp: false,
      ArrowLeft: false,
      ArrowRight: false,
      ArrowDown: false,
    };

    function resetGame() {
      butterfly.x = 100;
      butterfly.y = height / 2;
      butterfly.vx = 0;
      butterfly.vy = 0;
      butterfly.angle = 0;
      score = 0;
      frame = 0;
      obstacles.length = 0;
      createObstacle();
      scoreEl.textContent = score;
      gameActive = true;
      startText.textContent = 'Press Arrow Up to flap. Use Left and Right to steer.';
    }

    function createObstacle() {
      const minGapY = 110;
      const maxGapY = height - 140 - gapHeight;
      const gapY = Math.random() * (maxGapY - minGapY) + minGapY;
      obstacles.push({ x: width + obstacleWidth, gapY, passed: false });
    }

    function update() {
      if (!gameActive) return;
      frame++;
      if (keys.ArrowUp) {
        butterfly.vy = flapForce;
      }
      if (keys.ArrowDown) {
        butterfly.vy += 0.8;
      }
      if (keys.ArrowLeft) {
        butterfly.vx = -lateralSpeed;
      } else if (keys.ArrowRight) {
        butterfly.vx = lateralSpeed;
      } else {
        butterfly.vx *= 0.9;
      }

      butterfly.vy += gravity;
      butterfly.x += butterfly.vx;
      butterfly.y += butterfly.vy;
      butterfly.angle = Math.min(Math.max(butterfly.vy * 0.03, -0.8), 0.8);

      if (butterfly.x < butterfly.radius + 12) butterfly.x = butterfly.radius + 12;
      if (butterfly.x > width - butterfly.radius - 12) butterfly.x = width - butterfly.radius - 12;
      if (butterfly.y < butterfly.radius + 10) {
        butterfly.y = butterfly.radius + 10;
        butterfly.vy = 0;
      }
      if (butterfly.y > height - butterfly.radius - 20) {
        butterfly.y = height - butterfly.radius - 20;
        gameOver();
      }

      if (frame % obstacleSpacing === 0) {
        createObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= 2.8;
        if (!obs.passed && obs.x + obstacleWidth < butterfly.x - butterfly.radius) {
          obs.passed = true;
          score += 1;
          scoreEl.textContent = score;
        }
        if (obs.x < -obstacleWidth) {
          obstacles.splice(i, 1);
        }
        if (hitObstacle(obs)) {
          gameOver();
        }
      }
    }

    function hitObstacle(obs) {
      const insideX = butterfly.x + butterfly.radius > obs.x && butterfly.x - butterfly.radius < obs.x + obstacleWidth;
      if (!insideX) return false;
      const aboveGap = butterfly.y - butterfly.radius < obs.gapY;
      const belowGap = butterfly.y + butterfly.radius > obs.gapY + gapHeight;
      return aboveGap || belowGap;
    }

    function drawBackground() {
      const bg = ctx.createLinearGradient(0, 0, 0, height);
      bg.addColorStop(0, '#88def4');
      bg.addColorStop(0.55, '#8be17d');
      bg.addColorStop(1, '#6fbf5a');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.arc(70 + i * 70, 70 + (i % 2) * 20, 36, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawButterfly() {
      ctx.save();
      ctx.translate(butterfly.x, butterfly.y);
      ctx.rotate(butterfly.angle);
      ctx.fillStyle = '#ff6ec7';
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe082';
      const wingOffsets = [
        { x: -14, y: -8, rot: Math.PI / 6 },
        { x: -14, y: 10, rot: -Math.PI / 6 },
        { x: 14, y: -8, rot: -Math.PI / 6 },
        { x: 14, y: 10, rot: Math.PI / 6 },
      ];
      wingOffsets.forEach(({ x, y, rot }) => {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, 14, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      ctx.strokeStyle = '#4a148c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.quadraticCurveTo(0, -32, 0, -22);
      ctx.stroke();
      ctx.restore();
    }

    function drawObstacle(obs) {
      const x = obs.x;
      const topHeight = obs.gapY;
      const bottomY = obs.gapY + gapHeight;
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(x, 0, obstacleWidth, topHeight);
      ctx.fillRect(x, bottomY, obstacleWidth, height - bottomY - 20);
      drawLeaves(x + obstacleWidth / 2, topHeight, 'top');
      drawLeaves(x + obstacleWidth / 2, bottomY, 'bottom');
    }

    function drawLeaves(cx, y, position) {
      ctx.fillStyle = '#43a047';
      ctx.strokeStyle = '#1b5e20';
      ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) {
        const offset = i * 14;
        ctx.beginPath();
        if (position === 'top') {
          ctx.moveTo(cx + offset, y + 8);
          ctx.bezierCurveTo(cx + offset + 10, y + 24, cx + offset - 10, y + 24, cx + offset, y + 8);
        } else {
          ctx.moveTo(cx + offset, y - 8);
          ctx.bezierCurveTo(cx + offset + 10, y - 24, cx + offset - 10, y - 24, cx + offset, y - 8);
        }
        ctx.fill();
        ctx.stroke();
      }
    }

    function drawGround() {
      ctx.fillStyle = '#4a8b2e';
      ctx.fillRect(0, height - 20, width, 20);
      ctx.fillStyle = '#2e7d32';
      for (let i = 0; i < width / 25; i++) {
        ctx.fillRect(i * 25 + 5, height - 18, 12, 8);
      }
    }

    function draw() {
      drawBackground();
      drawGround();
      obstacles.forEach(drawObstacle);
      drawButterfly();
      if (!gameActive) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#fff';
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Press Arrow Up to Start', width / 2, height / 2 - 10);
        ctx.font = '16px Arial';
        ctx.fillText('Arrow keys move the butterfly through greenery', width / 2, height / 2 + 24);
      }
    }

    function gameOver() {
      gameActive = false;
      bestScore = Math.max(bestScore, score);
      startText.textContent = `Game over. Score: ${score}. Best: ${bestScore}. Press Up to restart.`;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (event) => {
      if (event.code in keys) {
        event.preventDefault();
        keys[event.code] = true;
      }
      if (!gameActive && event.code === 'ArrowUp') {
        resetGame();
      }
    });

    window.addEventListener('keyup', (event) => {
      if (event.code in keys) {
        keys[event.code] = false;
      }
    });

    canvas.addEventListener('click', () => {
      if (!gameActive) resetGame();
    });

    draw();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
